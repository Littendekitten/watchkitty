services:
  - type: web
    name: watchkitty-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter          # free tier (512MB RAM) will struggle with FFmpeg on anything but tiny clips
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false        # paste the full service-account JSON in the Render dashboard
      - key: FIREBASE_STORAGE_BUCKET
        sync: false        # e.g. watchkitty-12345.firebasestorage.app
      - key: PROCESSED_BUCKET
        sync: false        # optional: separate public bucket for HLS output
      - key: ALLOWED_ORIGINS
        value: https://YOUR_GITHUB_USERNAME.github.io
      - key: MAX_CONCURRENT_JOBS
        value: "1"
